"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install"
run_mode = "concurrent"

# The playground dev server. Vite binds $CONDUCTOR_PORT so each local workspace
# gets a stable, non-colliding port; hidden in cloud workspaces where that var
# is unset. This is the closest thing to "a server that's up while the workspace
# is active" — press Run once; Conductor does not autostart it.
[scripts.run.dev]
command = "npm run dev"
available_in = [ "local" ]
default = true
icon = "play"

# `npm run validate` — the same publish-time gate CI runs before the deploy hook.
[scripts.run.validate]
command = "npm run validate"
icon = "shield-check"

# `npm run new` is deliberately omitted: it prompts for a title and type via
# readline, and Conductor run scripts execute in a non-interactive shell. Run it
# from a terminal instead.
