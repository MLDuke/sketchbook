name: Trigger portfolio-site rebuild

on:
  push:
    branches: [main]

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runs before the hook, so a bad published entry blocks the rebuild
      # instead of failing inside portfolio-site's build.
      - name: Validate entries
        run: npm run validate

      - name: Call Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret not set — skipping. Add it in this repo's Settings > Secrets once portfolio-site's deploy hook exists."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
